version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Maintain dependencies for Bun
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"

  # Maintain dependencies for Bun
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "daily"

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: /
    schedule:
      interval: "daily"

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: /web
    schedule:
      interval: "daily"
